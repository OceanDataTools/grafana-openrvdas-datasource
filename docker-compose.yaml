services:
  grafana:
    extends:
      file: .config/docker-compose-base.yaml
      service: grafana
    environment:
      # Connection used by the provisioned data source; see
      # provisioning/datasources/datasources.yml. Set these in a git-ignored
      # .env file or the environment.
      CDS_URL: ${CDS_URL:-ws://host.docker.internal:8766}
      CDS_CONNECTION_MODE: ${CDS_CONNECTION_MODE:-direct}
      OPENRVDAS_API_KEY: ${OPENRVDAS_API_KEY:-}
