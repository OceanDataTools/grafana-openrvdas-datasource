apiVersion: 1

# Values come from the environment (see docker-compose.yaml); put them in a
# git-ignored .env file:
#
#   Direct (legacy, unauthenticated):
#     CDS_URL=ws://<host>:8766
#
#   OpenRVDAS API (authenticated):
#     CDS_CONNECTION_MODE=proxy
#     CDS_URL=wss://<host>/api/v1/ws/data-server
#     OPENRVDAS_API_KEY=<key with the WEBSOCKET permission>

datasources:
  - name: 'OpenRVDAS'
    uid: 'openrvdas-dev'
    type: 'oceandatatools-openrvdas-datasource'
    access: proxy
    isDefault: true
    orgId: 1
    version: 1
    editable: true
    jsonData:
      connectionMode: '${CDS_CONNECTION_MODE}'
      url: '${CDS_URL}'
      pollIntervalMs: 100
    secureJsonData:
      apiKey: '${OPENRVDAS_API_KEY}'
